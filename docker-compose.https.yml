# Опциональный вариант с доменом и автоматическим HTTPS (Caddy + Let's Encrypt).
# Используется вместо docker-compose.yml, если не хотите отдавать личный
# OAuth-токен по сети в открытом виде (см. основной docker-compose.yml —
# там сервер публикуется напрямую по IP:3000 без TLS).
#
# Домен не обязан быть "настоящим" — подойдёт и бесплатный IP-based хост
# вида 203-0-113-5.sslip.io (резолвится в ваш IP), Caddy сам получит для
# него валидный сертификат Let's Encrypt. Подставьте свой домен/sslip-хост
# в Caddyfile перед запуском.
#
# Запуск: docker compose -f docker-compose.https.yml up -d --build

services:
  yandex-tracker-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yandex-tracker-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRACKER_ORG_ID: ${TRACKER_ORG_ID:-}
      TRACKER_CLOUD_ORG_ID: ${TRACKER_CLOUD_ORG_ID:-}
      TRACKER_DEFAULT_QUEUE: ${TRACKER_DEFAULT_QUEUE:-}
      TRACKER_DEFAULT_PROJECT: ${TRACKER_DEFAULT_PROJECT:-}
    # Порт 3000 наружу в интернет НЕ пробрасывается — доступ только из
    # internal docker-сети, через reverse-proxy caddy ниже.
    expose:
      - "3000"
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: yandex-tracker-mcp-caddy
    restart: unless-stopped
    depends_on:
      - yandex-tracker-mcp
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
